<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0a0c;
    --ink: #f5f2ea;
    --ink-dim: rgba(245, 242, 234, 0.55);
    --ink-faint: rgba(245, 242, 234, 0.32);
    --line: rgba(245, 242, 234, 0.10);
    --card: rgba(245, 242, 234, 0.035);
    --card-hover: rgba(245, 242, 234, 0.07);
  }

  html { -webkit-text-size-adjust: 100%; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* soft top glow */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(60% 40% at 50% -5%, rgba(245, 242, 234, 0.07), transparent 70%),
      radial-gradient(45% 30% at 50% 108%, rgba(245, 242, 234, 0.04), transparent 70%);
  }

  main {
    width: 100%;
    max-width: 27rem;
    padding: clamp(3.5rem, 10vh, 6rem) 1.5rem 3rem;
    position: relative;
  }

  .monogram {
    width: 4.25rem;
    height: 4.25rem;
    border-radius: 50%;
    border: 1px solid var(--line);
    background:
      radial-gradient(120% 120% at 30% 20%, rgba(245, 242, 234, 0.09), rgba(245, 242, 234, 0.02));
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 1.4rem;
    font-family: "Instrument Serif", Georgia, serif;
    font-size: 1.55rem;
    letter-spacing: 0.04em;
    color: var(--ink);
    user-select: none;
  }

  h1 {
    font-family: "Instrument Serif", Georgia, serif;
    font-weight: 400;
    font-size: 2.1rem;
    text-align: center;
    letter-spacing: 0.01em;
  }

  .tag {
    text-align: center;
    color: var(--ink-dim);
    font-size: 0.95rem;
    margin-top: 0.45rem;
  }

  .tag .dot {
    display: inline-block;
    margin: 0 0.55em;
    opacity: 0.5;
  }

  nav {
    margin-top: 2.6rem;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }

  .link {
    display: flex;
    align-items: center;
    gap: 0.95rem;
    padding: 1rem 1.15rem;
    border: 1px solid var(--line);
    border-radius: 1rem;
    background: var(--card);
    text-decoration: none;
    color: var(--ink);
    transition: background 160ms ease, border-color 160ms ease, transform 160ms ease;
  }

  .link:hover, .link:focus-visible {
    background: var(--card-hover);
    border-color: rgba(245, 242, 234, 0.22);
    transform: translateY(-1px);
  }

  .link:active { transform: translateY(0); }

  .link:focus-visible {
    outline: 1.5px solid rgba(245, 242, 234, 0.5);
    outline-offset: 2px;
  }

  .link .icon {
    width: 2.35rem;
    height: 2.35rem;
    flex: none;
    border-radius: 0.7rem;
    border: 1px solid var(--line);
    background: rgba(245, 242, 234, 0.03);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .link .icon svg {
    width: 1.15rem;
    height: 1.15rem;
    fill: var(--ink);
    display: block;
  }

  .link .text { flex: 1; min-width: 0; }

  .link .name {
    font-weight: 600;
    font-size: 0.98rem;
    letter-spacing: 0.005em;
  }


  .link .arrow {
    flex: none;
    color: var(--ink-faint);
    transition: color 160ms ease, transform 160ms ease;
  }

  .link:hover .arrow {
    color: var(--ink-dim);
    transform: translateX(2px);
  }

  .section-gap { margin-top: 1.5rem; }

  footer {
    margin-top: 3.2rem;
    text-align: center;
    color: var(--ink-faint);
    font-size: 0.78rem;
    letter-spacing: 0.02em;
  }

  @media (prefers-reduced-motion: reduce) {
    .link, .link .arrow { transition: none; }
  }
</style>

<script>
  // On phones, try the native app first; fall back to the web profile if the
  // app doesn't take over the page within the grace period.
  (function () {
    var mobile = /iphone|ipad|ipod|android/i.test(navigator.userAgent);
    if (!mobile) return;
    document.querySelectorAll("a[data-app]").forEach(function (a) {
      a.addEventListener("click", function (e) {
        e.preventDefault();
        var web = a.href;
        var timer = setTimeout(function () { window.location.href = web; }, 1200);
        var cancel = function () { clearTimeout(timer); };
        window.addEventListener("pagehide", cancel, { once: true });
        document.addEventListener("visibilitychange", function () {
          if (document.hidden) cancel();
        }, { once: true });
        window.location.href = a.getAttribute("data-app");
      });
    });
  })();
</script>
