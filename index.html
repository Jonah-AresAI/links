<html lang="en">
<head>
<meta charset="utf-8" />

<title>Jonah Thorndike</title>

<meta property="og:description" content="Links to Ares, the Ekris card, and everywhere else." />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://links.aresdeploy.com" />
<meta name="theme-color" content="#050506" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23050506'/%3E%3Ctext x='16' y='21.5' font-family='Georgia,serif' font-size='15' fill='%23f5f2ea' text-anchor='middle'%3EJT%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #050506;
    --ink: #f5f2ea;
    --ink-dim: rgba(245, 242, 234, 0.55);
    --ink-faint: rgba(245, 242, 234, 0.32);
    --glass-ink: rgba(235, 235, 240, 0.55);
    --card: rgba(245, 242, 234, 0.035);
    --card-hover: rgba(245, 242, 234, 0.07);
    --ease-out: cubic-bezier(.22, 1, .36, 1);
  }

  html { -webkit-text-size-adjust: 100%; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* faint backlight so the black has depth */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(65% 42% at 50% -6%, rgba(245, 242, 234, 0.06), transparent 70%),
      radial-gradient(50% 34% at 50% 110%, rgba(245, 242, 234, 0.035), transparent 70%);
  }

  /* ---------- hero ---------- */

  .hero {
    width: 100%;
    max-width: 30rem;
    margin: 0 auto;
    position: relative;
    animation: heroIn 1.1s var(--ease-out) both;
  }

  .hero img {
    width: 100%;
    display: block;
    -webkit-mask-image: linear-gradient(180deg,
      #000 46%,
      rgba(0, 0, 0, 0.99) 55%,
      rgba(0, 0, 0, 0.95) 63%,
      rgba(0, 0, 0, 0.85) 70%,
      rgba(0, 0, 0, 0.68) 77%,
      rgba(0, 0, 0, 0.46) 84%,
      rgba(0, 0, 0, 0.24) 90%,
      rgba(0, 0, 0, 0.08) 96%,
      transparent 100%);
    mask-image: linear-gradient(180deg,
      #000 46%,
      rgba(0, 0, 0, 0.99) 55%,
      rgba(0, 0, 0, 0.95) 63%,
      rgba(0, 0, 0, 0.85) 70%,
      rgba(0, 0, 0, 0.68) 77%,
      rgba(0, 0, 0, 0.46) 84%,
      rgba(0, 0, 0, 0.24) 90%,
      rgba(0, 0, 0, 0.08) 96%,
      transparent 100%);
  }

  /* darkening veil over the fade zone so the light photo settles into
     black without a grey band */
  .hero::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(180deg,
      transparent 40%,
      rgba(5, 5, 6, 0.12) 62%,
      rgba(5, 5, 6, 0.42) 80%,
      rgba(5, 5, 6, 0.75) 92%,
      var(--bg) 100%);
  }

  main {
    width: 100%;
    max-width: 27rem;
    padding: 0 1.25rem 3.5rem;
    position: relative;
    margin-top: -2.4rem;
  }

  h1 {
    font-weight: 600;
    font-size: 1.7rem;
    text-align: center;
    letter-spacing: -0.01em;
    animation: rise 0.8s 0.2s var(--ease-out) both;
  }

  /* ---------- rows ---------- */

  nav {
    margin-top: 1.9rem;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }

  .row {
    animation: rise 0.7s var(--ease-out) both;
  }
  .row:nth-child(1) { animation-delay: 0.30s; }
  .row:nth-child(2) { animation-delay: 0.38s; }
  .row:nth-child(3) { animation-delay: 0.46s; }
  .row:nth-child(4) { animation-delay: 0.54s; }
  .row:nth-child(5) { animation-delay: 0.62s; }
  .row:nth-child(6) { animation-delay: 0.70s; }

  /* Pills carry the EKRIS card's edge: hairline stroke, top catch-light,
     shaded underside, faint vertical light falloff, lift shadows below. */
  .link {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 0.95rem;
    padding: 0.95rem 1.45rem;
    border: 1px solid rgba(255, 255, 255, 0.09);
    border-radius: 999px;
    background:
      linear-gradient(180deg, rgba(255, 255, 255, 0.05) 0%, transparent 14%, transparent 82%, rgba(0, 0, 0, 0.28) 100%),
      var(--card);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.16),
      inset 0 -1px 1px rgba(0, 0, 0, 0.55),
      0 10px 20px rgba(0, 0, 0, 0.55),
      0 2px 5px rgba(0, 0, 0, 0.4);
    color: var(--ink);
    font-family: inherit;
    font-size: 1rem;
    text-align: left;
    cursor: pointer;
    transition: background 180ms ease, border-color 180ms ease, transform 220ms var(--ease-out);
  }

  .link:hover, .link:focus-visible {
    background:
      linear-gradient(180deg, rgba(255, 255, 255, 0.05) 0%, transparent 14%, transparent 82%, rgba(0, 0, 0, 0.28) 100%),
      var(--card-hover);
    border-color: rgba(255, 255, 255, 0.18);
    transform: translateY(-2px);
  }

  .link:active { transform: translateY(0) scale(0.985); }

  .link:focus-visible {
    outline: 1.5px solid rgba(245, 242, 234, 0.5);
    outline-offset: 2px;
  }

  .link .icon {
    width: 1.6rem;
    height: 1.6rem;
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .link .icon svg {
    width: 1.35rem;
    height: 1.35rem;
    fill: var(--glass-ink);
    display: block;
    filter:
      drop-shadow(0 1px 0 rgba(255, 255, 255, 0.14))
      drop-shadow(0 2px 5px rgba(0, 0, 0, 0.45));
  }

  .icon.ic-ares svg { fill: none; width: 1.45rem; height: auto; }
  .icon.ic-ares svg path { stroke: var(--glass-ink); }
  .icon.ic-ekris svg { width: 1.5rem; height: auto; }

  .link .name {
    flex: 1;
    min-width: 0;
    font-weight: 600;
    font-size: 0.98rem;
    letter-spacing: 0.005em;
    color: var(--glass-ink);
    text-shadow: 0 1px 0 rgba(0, 0, 0, 0.5);
  }

  .link .arrow {
    flex: none;
    color: var(--ink-faint);
    transition: transform 320ms var(--ease-out), color 180ms ease;
  }

  .link:hover .arrow { color: var(--ink-dim); }
  .row.open .link .arrow { transform: rotate(90deg); color: var(--ink-dim); }

  /* ---------- drawers ---------- */

  .drawer {
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows 480ms var(--ease-out);
  }

  .row.open .drawer { grid-template-rows: 1fr; }

  .drawer-inner { overflow: hidden; min-height: 0; }

  .drawer-pad {
    padding: 0.85rem 0.35rem 0.5rem;
    opacity: 0;
    transform: translateY(-6px);
    transition: opacity 320ms ease, transform 420ms var(--ease-out);
  }

  .row.open .drawer-pad {
    opacity: 1;
    transform: none;
    transition-delay: 120ms;
  }

  /* browser-chrome frame, same glass language as the pills */
  .frame {
    border: 1px solid rgba(255, 255, 255, 0.09);
    border-radius: 18px;
    overflow: hidden;
    background: #0b0b0d;
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.10),
      0 14px 30px rgba(0, 0, 0, 0.6),
      0 3px 8px rgba(0, 0, 0, 0.45);
  }

  .frame-bar {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.55rem 0.8rem;
    background: rgba(255, 255, 255, 0.045);
    border-bottom: 1px solid rgba(255, 255, 255, 0.07);
  }

  .frame-bar i {
    width: 0.55rem;
    height: 0.55rem;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.16);
  }

  .frame-bar .url {
    flex: 1;
    margin-left: 0.35rem;
    font-size: 0.72rem;
    letter-spacing: 0.01em;
    color: var(--ink-faint);
    background: rgba(255, 255, 255, 0.05);
    border-radius: 999px;
    padding: 0.18rem 0.7rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .frame-body {
    position: relative;
    height: min(108vw, 430px);
    overflow: hidden;
    background: #0b0b0d;
  }

  .frame-body iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
    background: #0b0b0d;
  }

  .frame-body img.kb {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    animation: kenburns 26s ease-in-out infinite alternate;
  }

  .p-ig  { object-position: center top; }
  .p-x   { object-position: center top; }
  .p-yt  { object-position: center top; }

  @keyframes kenburns {
    from { transform: scale(1) translateY(0); }
    to   { transform: scale(1.08) translateY(-3.5%); }
  }

  /* linkedin designed card (no anonymous embed exists) */
  .li-card {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.6rem;
    text-align: center;
    padding: 1.5rem;
    background:
      radial-gradient(80% 60% at 50% 0%, rgba(10, 102, 194, 0.16), transparent 70%),
      #0b0b0d;
  }

  .li-card svg { width: 2.4rem; height: 2.4rem; fill: rgba(235, 235, 240, 0.75); }
  .li-card .li-name { font-weight: 600; font-size: 1.15rem; }
  .li-card .li-sub { color: var(--ink-dim); font-size: 0.88rem; max-width: 16rem; }

  .cta {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    margin-top: 0.7rem;
    padding: 0.8rem 1.3rem;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.14);
    background: rgba(255, 255, 255, 0.07);
    backdrop-filter: blur(22px) saturate(180%);
    -webkit-backdrop-filter: blur(22px) saturate(180%);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.22),
      inset 0 -1px 0 rgba(0, 0, 0, 0.35),
      0 8px 22px rgba(0, 0, 0, 0.45);
    color: var(--ink);
    font-weight: 600;
    font-size: 0.92rem;
    text-decoration: none;
    transition: background 180ms ease, border-color 180ms ease, transform 220ms var(--ease-out);
  }

  .cta:hover { background: rgba(255, 255, 255, 0.11); border-color: rgba(255, 255, 255, 0.2); transform: translateY(-1px); }
  .cta:active { transform: scale(0.985); }
  .cta svg { width: 0.85rem; height: 0.85rem; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: none; }
  }

  @keyframes heroIn {
    from { opacity: 0; transform: scale(1.03); }
    to   { opacity: 1; transform: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .hero, h1, .row, .link, .link .arrow, .drawer, .drawer-pad, .cta { animation: none; transition: none; }
    .frame-body img.kb { animation: none; }
  }
</style>
</head>

<script>
  (function () {
    // Accordion: one drawer open at a time. Live iframes load on first open.
    var rows = Array.prototype.slice.call(document.querySelectorAll(".row"));
    rows.forEach(function (row) {
      var btn = row.querySelector(".link");
      var drawer = row.querySelector(".drawer");
      btn.addEventListener("click", function () {
        var wasOpen = row.classList.contains("open");
        rows.forEach(function (r) {
          r.classList.remove("open");
          r.querySelector(".link").setAttribute("aria-expanded", "false");
          r.querySelector(".drawer").setAttribute("aria-hidden", "true");
        });
        if (!wasOpen) {
          row.classList.add("open");
          btn.setAttribute("aria-expanded", "true");
          drawer.setAttribute("aria-hidden", "false");
          var ifr = row.querySelector("iframe[data-src]");
          if (ifr && !ifr.getAttribute("src")) ifr.setAttribute("src", ifr.getAttribute("data-src"));
        }
      });
    });

    // On phones, try the native app first; fall back to the web profile if
    // the app doesn't take over the page within the grace period.
    var mobile = /iphone|ipad|ipod|android/i.test(navigator.userAgent);
    if (!mobile) return;
    document.querySelectorAll("a[data-app]").forEach(function (a) {
      a.addEventListener("click", function (e) {
        e.preventDefault();
        var web = a.href;
        var timer = setTimeout(function () { window.location.href = web; }, 1200);
        var cancel = function () { clearTimeout(timer); };
        window.addEventListener("pagehide", cancel, { once: true });
        document.addEventListener("visibilitychange", function () {
          if (document.hidden) cancel();
        }, { once: true });
        window.location.href = a.getAttribute("data-app");
      });
    });
  })();
</script>
