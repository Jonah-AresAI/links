<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    /* Sampled from the hero photo's background: pale teal glass, brighter
       window light toward the top. */
    --bg: #ccdcdb;
    --bg-top: #d9e5e5;
    --bg-deep: #c1d4d2;
    --ink: #1e2a28;
    --ink-dim: rgba(30, 42, 40, 0.60);
    --ink-faint: rgba(30, 42, 40, 0.38);
    --glass-ink: rgba(35, 48, 46, 0.60);
    --card: rgba(255, 255, 255, 0.30);
    --card-hover: rgba(255, 255, 255, 0.46);
  }

  html { -webkit-text-size-adjust: 100%; }

  body {
    background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg) 45%, var(--bg-deep) 100%) fixed var(--bg);
    color: var(--ink);
    font-family: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* Hero photo: top of the page, bottom fades into the pills. */
  .hero {
    width: 100%;
    max-width: 30rem;
    margin: 0 auto;
    position: relative;
  }

  /* Long eased dissolve — smoothstep stops so there is no visible band
     where the photo ends and the page begins. */
  .hero img {
    width: 100%;
    display: block;
    -webkit-mask-image: linear-gradient(180deg,
      #000 50%,
      rgba(0, 0, 0, 0.99) 58%,
      rgba(0, 0, 0, 0.95) 65%,
      rgba(0, 0, 0, 0.86) 72%,
      rgba(0, 0, 0, 0.70) 79%,
      rgba(0, 0, 0, 0.48) 85%,
      rgba(0, 0, 0, 0.26) 91%,
      rgba(0, 0, 0, 0.09) 96%,
      transparent 100%);
    mask-image: linear-gradient(180deg,
      #000 50%,
      rgba(0, 0, 0, 0.99) 58%,
      rgba(0, 0, 0, 0.95) 65%,
      rgba(0, 0, 0, 0.86) 72%,
      rgba(0, 0, 0, 0.70) 79%,
      rgba(0, 0, 0, 0.48) 85%,
      rgba(0, 0, 0, 0.26) 91%,
      rgba(0, 0, 0, 0.09) 96%,
      transparent 100%);
  }

  main {
    width: 100%;
    max-width: 27rem;
    padding: 0 1.5rem 3.5rem;
    position: relative;
    margin-top: -1.6rem;
  }

  h1 {
    font-weight: 600;
    font-size: 1.7rem;
    text-align: center;
    letter-spacing: -0.01em;
  }

  nav {
    margin-top: 1.9rem;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }

  /* Pills carry the EKRIS card's edge: hairline stroke, top catch-light,
     shaded underside, faint vertical light falloff, lift shadows below —
     so each reads as a lit object, not a flat button. */
  .link {
    display: flex;
    align-items: center;
    gap: 0.95rem;
    padding: 0.95rem 1.45rem;
    border: 1px solid rgba(255, 255, 255, 0.60);
    border-radius: 999px;
    background:
      linear-gradient(180deg, rgba(255, 255, 255, 0.55) 0%, rgba(255, 255, 255, 0.12) 14%, rgba(255, 255, 255, 0.12) 82%, rgba(96, 118, 116, 0.22) 100%),
      var(--card);
    backdrop-filter: blur(14px) saturate(160%);
    -webkit-backdrop-filter: blur(14px) saturate(160%);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.85),
      inset 0 -1px 1px rgba(40, 60, 58, 0.25),
      0 10px 24px rgba(40, 60, 58, 0.20),
      0 2px 6px rgba(40, 60, 58, 0.13);
    text-decoration: none;
    color: var(--ink);
    transition: background 160ms ease, border-color 160ms ease, transform 160ms ease;
  }

  .link:hover, .link:focus-visible {
    background:
      linear-gradient(180deg, rgba(255, 255, 255, 0.55) 0%, rgba(255, 255, 255, 0.12) 14%, rgba(255, 255, 255, 0.12) 82%, rgba(96, 118, 116, 0.22) 100%),
      var(--card-hover);
    border-color: rgba(255, 255, 255, 0.8);
    transform: translateY(-1px);
  }

  .link:active { transform: translateY(0); }

  .link:focus-visible {
    outline: 1.5px solid rgba(30, 42, 40, 0.5);
    outline-offset: 2px;
  }

  /* Bare badges, EKRIS-card style: no box, the glyph itself is the grey
     tinted glass — translucent ink with a specular top edge and a shaded
     underside. */
  .link .icon {
    width: 1.6rem;
    height: 1.6rem;
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .link .icon svg {
    width: 1.35rem;
    height: 1.35rem;
    fill: var(--glass-ink);
    display: block;
    filter: drop-shadow(0 1px 0 rgba(255, 255, 255, 0.55));
  }

  /* The Ares mark is stroked, not filled — same glass ink. */
  .icon.ic-ares svg { fill: none; width: 1.45rem; height: auto; }
  .icon.ic-ares svg path { stroke: var(--glass-ink); }
  /* The Ekris house glyph is wide (1342x894). */
  .icon.ic-ekris svg { width: 1.5rem; height: auto; }

  .link .text { flex: 1; min-width: 0; }

  /* Labels etched in the same tinted glass as the glyphs: translucent
     ink with a white catch-light beneath, debossed into the surface. */
  .link .name {
    font-weight: 600;
    font-size: 0.98rem;
    letter-spacing: 0.005em;
    color: var(--glass-ink);
    text-shadow: 0 1px 0 rgba(255, 255, 255, 0.5);
  }


  .link .arrow {
    flex: none;
    color: var(--ink-faint);
    transition: color 160ms ease, transform 160ms ease;
  }

  .link:hover .arrow {
    color: var(--ink-dim);
    transform: translateX(2px);
  }

  @media (prefers-reduced-motion: reduce) {
    .link, .link .arrow { transition: none; }
  }
</style>

<script>
  // On phones, try the native app first; fall back to the web profile if the
  // app doesn't take over the page within the grace period.
  (function () {
    var mobile = /iphone|ipad|ipod|android/i.test(navigator.userAgent);
    if (!mobile) return;
    document.querySelectorAll("a[data-app]").forEach(function (a) {
      a.addEventListener("click", function (e) {
        e.preventDefault();
        var web = a.href;
        var timer = setTimeout(function () { window.location.href = web; }, 1200);
        var cancel = function () { clearTimeout(timer); };
        window.addEventListener("pagehide", cancel, { once: true });
        document.addEventListener("visibilitychange", function () {
          if (document.hidden) cancel();
        }, { once: true });
        window.location.href = a.getAttribute("data-app");
      });
    });
  })();
